name: build

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

env: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: 安装Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建主程序
        run: mvn package

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: xyc-Launcher
          path: ./target/xyc-Launcher-1.0-SNAPSHOT.jar
          retention-days: 7